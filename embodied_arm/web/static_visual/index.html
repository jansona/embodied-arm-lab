<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO-ARM101 · 图像对话控制</title><link rel="stylesheet" href="/static/style.css"></head><body><main>
<header><p>SO-ARM101 · 仅虚拟机器人</p><h1>用图像和对话指挥机械臂</h1><p>完整相机图像 → Qwen 观察与任务指引 → Jev 有界动作 → 新图像复核</p></header>
<section><h2>输入任务</h2><p id="readiness" role="status">正在检查服务</p><p class="muted">实验性仿真。完成由 Qwen 的图像判断报告，不代表独立几何验证，也不适用于真实硬件。</p><textarea id="request" maxlength="2000" placeholder="描述你希望机械臂做什么"></textarea><p id="input-status"></p><button id="task-send" disabled>提交并执行任务</button> <button id="stop" disabled>停止</button><details><summary>只交流（不执行）</summary><button id="chat-send" disabled>发送但不执行</button></details><p id="error" role="alert"></p></section>
<section><h2>实时相机</h2><div class="cameras"><figure><img id="camera-left" alt="相机 A"><figcaption id="camera-left-caption">等待相机元数据</figcaption></figure><figure><img id="camera-right" alt="相机 B"><figcaption id="camera-right-caption">等待相机元数据</figcaption></figure></div><p id="camera-status"></p><p class="muted">本地画面采样不调用模型；模型请求仅由任务流程触发。识别使用完整图像。</p></section>
<div class="columns"><section><h2>任务状态</h2><p id="request-id"></p><p id="workflow-status" role="status"></p><p id="budgets"></p><div id="runtime-notices"></div><div id="chat-history"></div></section><section><h2>Qwen 图像判断与 Jev 动作</h2><p id="observation"></p><ol id="events"></ol><p id="outcome"></p><p class="muted">展示模型结构化输出与实际动作记录，不展示内部思考。接受指令、施加动作和完成判断分别记录。</p></section></div>
<details><summary>机器人状态 / 重置</summary><pre id="robot"></pre><button id="reset">重置虚拟场景</button></details></main><script src="/static/ui.js"></script></body></html>
