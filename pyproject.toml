[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-arm-lab"
version = "0.1.0"
description = "Image-grounded SO101 simulation and bounded Qwen/Jev experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pybullet==3.2.7",
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "httpx[socks]==0.28.1",
  "Pillow>=10,<13",
  "numpy>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
embodied-arm = "embodied_arm.runtime.start_so101:main"

[tool.setuptools.packages.find]
include = ["embodied_arm*"]

[tool.setuptools.package-data]
embodied_arm = ["assets/so101/*", "assets/so101/assets/*", "web/static/*", "web/static_so101/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
